name: application-operations-proxy

services:
  staging:
    # Nginx 1.30.6, Alpine slim; verified before integration.
    image: nginx/nginx-unprivileged@sha256:931bec1e41a3a643f2672162405093fe04002dd20e41d04faf67d700b7556b49
    user: "101:101"
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - type: bind
        source: ./deploy/nginx/staging.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: false
    networks:
      - staging
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -T
        - "3"
        - -O
        - /dev/null
        - http://127.0.0.1:8080/health/ready
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  production:
    # Nginx 1.30.6, Alpine slim; verified before integration.
    image: nginx/nginx-unprivileged@sha256:931bec1e41a3a643f2672162405093fe04002dd20e41d04faf67d700b7556b49
    user: "101:101"
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:8080"
    volumes:
      - type: bind
        source: ./deploy/nginx/production.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: false
    networks:
      - production
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -T
        - "3"
        - -O
        - /dev/null
        - http://127.0.0.1:8080/health/ready
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  staging:
    external: true
    name: application-operations-staging_default
  production:
    external: true
    name: application-operations-production_default
