name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    outputs:
      image_artifact_id: ${{ steps.upload_image.outputs.artifact-id }}
    name: Code, database, and image checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      POSTGRES_DB: appops_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci_admin_password
      APP_DB_HOST: 127.0.0.1
      APP_DB_PORT: "55433"
      APP_DB_NAME: appops_test
      APP_DB_USER: appops_test_app
      APP_DB_PASSWORD: ci_application_password

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: appops_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_admin_password
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d appops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.23"
          python-version: "3.14"
          enable-cache: true

      - name: Run code checks and unit tests
        run: ./scripts/check.sh

      - name: Check monitoring configuration and alert rules
        run: ./scripts/check_monitoring.sh

      - name: Check Nginx proxy configuration
        run: ./scripts/check_proxy.sh

      - name: Prepare the test database
        run: |
          uv run --locked python scripts/bootstrap_db.py
          uv run --locked alembic upgrade head

      - name: Run PostgreSQL integration tests
        env:
          RUN_DB_TESTS: "1"
        run: uv run --locked python -m pytest tests/integration -v

      - name: Build the application image
        run: |
          docker build \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag application-operations-platform:ci \
            .

      - name: Check image contents and runtime user
        run: |
          docker run --rm -i application-operations-platform:ci python - <<'PY'
          import importlib.util
          import os
          import tomllib
          from pathlib import Path

          from app.main import APP_VERSION, app

          assert os.getuid() == 10001
          assert not list(Path("/app").glob(".env*"))
          assert importlib.util.find_spec("pytest") is None
          assert importlib.util.find_spec("ruff") is None

          with Path("/app/pyproject.toml").open("rb") as file:
              project = tomllib.load(file)

          assert APP_VERSION == project["project"]["version"]
          print("Application:", app.title)
          print("Version:", APP_VERSION)
          print("Image checks passed.")
          PY

      - name: Save the tested image
        if: >-
          github.ref == 'refs/heads/main'
          && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          image_dir="$RUNNER_TEMP/tested-image"
          mkdir -p "$image_dir"
          docker image inspect --format '{{.Id}}' \
            application-operations-platform:ci > "$image_dir/image-id.txt"
          docker image save application-operations-platform:ci |
            gzip -1 > "$image_dir/image.tar.gz"
          (
            cd "$image_dir"
            sha256sum image.tar.gz > SHA256SUMS
          )

      - name: Upload the tested image
        id: upload_image
        if: >-
          github.ref == 'refs/heads/main'
          && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-image-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tested-image/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish the tested image
    needs: checks
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download the tested image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.checks.outputs.image_artifact_id }}
          path: ${{ runner.temp }}/tested-image/

      - name: Verify the image before publishing
        run: |
          cd "$RUNNER_TEMP/tested-image"
          sha256sum --check SHA256SUMS
          docker image load --input image.tar.gz

          image="application-operations-platform:ci"
          expected_id="$(cat image-id.txt)"
          actual_id="$(docker image inspect --format '{{.Id}}' "$image")"
          test "$actual_id" = "$expected_id"

          revision="$(docker image inspect \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")"
          test "$revision" = "$GITHUB_SHA"
          printf 'Verified image: %s\nSource commit: %s\n' "$actual_id" "$revision"

      - name: Publish to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          registry_repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          registry_image="$registry_repository:${GITHUB_SHA:0:12}"

          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

          docker image tag application-operations-platform:ci "$registry_image"
          docker image push "$registry_image"

          digest="$(docker image inspect \
            --format '{{index .RepoDigests 0}}' "$registry_image")"
          [[ "$digest" == "$registry_repository@sha256:"* ]]

          {
            printf '### Published image\n\n'
            printf -- '- Tag: %s\n' "$registry_image"
            printf -- '- Digest reference: %s\n' "$digest"
            printf -- '- Source commit: %s\n' "$GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

          printf 'Published: %s\nDigest reference: %s\n' "$registry_image" "$digest"

      - name: Log out of the registry
        if: always()
        run: docker logout ghcr.io
