global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: application-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - application-operations-staging-api-1:8000
        labels:
          environment: staging

      - targets:
          - application-operations-production-api-1:8000
        labels:
          environment: production
